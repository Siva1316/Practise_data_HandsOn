version: "2.2"

x-lens2-environment: &lens2-environment
  # DataOS
  DATAOS_FQDN: liberal-donkey.dataos.app
  # Overview
  LENS2_NAME: siva-model-lens-updated
  LENS2_DESCRIPTION: "This Lens provides hotel bookings based on hotel click booking, location hirechary and Vm user location "
  LENS2_TAGS: "hotel booking, vm user, loc hierarchy "
  LENS2_AUTHORS: "acies05"
  LENS2_SCHEDULED_REFRESH_TIMEZONES: "UTC,America/Vancouver,America/Toronto"
  # Data Source
  LENS2_SOURCE_TYPE: minerva
  LENS2_SOURCE_NAME: miniature
  LENS2_SOURCE_CATALOG_NAME: icebase
  DATAOS_RUN_AS_APIKEY: dG9rZW5fZGVhZGx5X2xvb3NlbHlfb3V0Z29pbmdfc2hhZC40Mzc4NmMyYy01M2YyLTQ2ODctYWRiOC0wOGNlMzE5ZDA3Yjg
  # Log
  LENS2_LOG_LEVEL: error
  CACHE_LOG_LEVEL: "error"
  # Operation
  LENS2_DEV_MODE: true  
  LENS2_DEV_MODE_PLAYGROUND: false 
  LENS2_REFRESH_WORKER: true
  LENS2_SCHEMA_PATH: Model
  LENS2_PG_SQL_PORT: 5432
  CUBESTORE_DATA_DIR: "/var/work/.store"
  ODE_ENV: production
  LENS2_ALLOW_UNGROUPED_WITHOUT_PRIMARY_KEY: "true"

services:
  api:
    restart: always
    image: rubiklabs/lens2:0.35.18-50
    ports:
      - "4000:4000" # Lens API server
      - "5432:5432" # PostgreSQL
      - "3030:3030" # Table Stored
    environment:
      <<: *lens2-environment   
    volumes:
      - ./Model:/etc/dataos/work/Model